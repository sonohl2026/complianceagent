[project]
name = "medtech-compliance-agent-backend"
version = "0.1.0"
description = "MedTech Reimbursement Readiness Agent - backend API and workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<0.4",
    "alembic>=1.13,<2",
    "celery[redis]>=5.4,<6",
    "redis>=5.1,<6",
    "httpx>=0.27,<0.28",
    "python-multipart>=0.0.12",
    "openai>=1.54,<2",
    "beautifulsoup4>=4.12,<5",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "openpyxl>=3.1,<4",
    "charset-normalizer>=3.4,<4",
    "sentence-transformers>=3.2,<4",
    "jsonschema>=4.23,<5",
    "weasyprint>=62,<65",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.7,<0.8",
    "respx>=0.21,<0.22",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
